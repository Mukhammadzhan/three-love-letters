<!doctype html>
<html lang="uz-Cyrl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff5ef">
  <title>Учта мактуб, фақат сиз учун ❤️</title>
  <meta name="description" content="Ҳар бирида сиз учун кичик бир сир бор... Меҳр билан ёзилган учта мактуб.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Учта мактуб, фақат сиз учун ❤️">
  <meta property="og:description" content="Ҳар бирида сиз учун кичик бир сир бор...">
  <meta property="og:image" content="https://mukhammadzhan.github.io/three-love-letters/assets/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://mukhammadzhan.github.io/three-love-letters/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/heart.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <img class="branch branch-top" src="assets/sakura.svg" alt="" aria-hidden="true">
  <img class="branch branch-bottom" src="assets/sakura.svg" alt="" aria-hidden="true">
  <main>
    <header class="intro">
      <p class="eyebrow">ҚАЛБИМДАН — ҚАЛБИНГИЗГА</p>
      <h1>Учта мактуб,<br><em>фақат сиз учун</em> <span class="title-heart">♡</span><span class="sr-only">❤️</span></h1>
      <p class="subtitle">Ҳар бирида сиз учун кичик бир сир бор...</p>
      <div class="ornament" aria-hidden="true"><span></span>♡<span></span></div>
      <p class="hint">Конвертга тегинг ва сирни очинг</p>
    </header>
    <div class="envelopes" aria-label="Учта сирли мактуб"></div>
    <footer><span aria-hidden="true">♡</span><p>Масофалардан ҳам кучлироқ — меҳрим.</p><small>Сиз учун, меҳр билан.</small></footer>
  </main>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  <dialog id="surprise" aria-labelledby="letter-title">
    <div class="dialog-toolbar"><span class="dialog-label">ФАҚАТ СИЗ УЧУН</span><button class="close" aria-label="Мактубни ёпиш">×</button></div>
    <div class="dialog-scroll" tabindex="0"></div>
  </dialog>
  <template id="poem-template">
    <article class="letter poem-letter">
      <div class="letter-mark" aria-hidden="true">♡</div>
      <p class="eyebrow">БИРИНЧИ МАКТУБ</p>
      <h2 id="letter-title">Кўнглимдаги ягона гўзалимга ❤️</h2>
      <div class="poem">
        <p>Бир табассумингиз кўрай деб, ҳазил қилдим, эркатойим,<br>Билмай озор етказибман, хира бўлди кўнглингиз.<br>Харитада яқинман деп, аслида болдим узоқроқ,<br>Аммо сизга интилган дил ҳар қачонгидан яқинроқ.</p>
        <p>Қанийди ёнингизда бўлсам, чарчоғингизни олардим,<br>Кўзларингизга боқиб аста, дардингизни унутдирардим.<br>Ҳижрон бизни айирса ҳам, меҳрим асло сўнмайди,<br>Сизнинг бир табассумингизга ҳеч бир бойлик тенг келмайди.</p>
        <p>Ҳазилимда хато бўлди, аммо ниятим чин, билинг,<br>Кўнглингизни оғритган бўлсам, мени кечиринг, олтиним.<br>Висол куни келгунича, бир тилагим бор фақат:<br>Юзингиздан кулгу аримасин, қалбингизда яшнасин бахт. ❤️</p>
      </div>
      <div class="signature">Бутун меҳрим билан, сизники ♡</div>
      <button class="return-button" data-close>Конвертларга қайтиш <span aria-hidden="true">↩</span></button>
    </article>
  </template>
  <template id="rose-template">
    <article class="letter rose-letter">
      <p class="eyebrow">ИККИНЧИ МАКТУБ</p>
      <div class="rose-garden" aria-label="Аста-секин очилаётган пушти атиргул" role="img"></div>
      <h2 id="letter-title">Бу гул сиз учун, олтиним 🌹</h2>
      <p class="message">Қанийди ҳозир ёнингизда бўлсам, бу гулни ўз қўлларим билан сизга тутқазар эдим. ❤️</p>
      <button class="return-button" data-close>Конвертларга қайтиш <span aria-hidden="true">↩</span></button>
    </article>
  </template>
  <template id="photo-template">
    <article class="letter photo-letter">
      <p class="eyebrow">УЧИНЧИ МАКТУБ</p>
      <figure class="photo-frame"><img src="assets/portrait.png" width="1086" height="1448" alt="Сиз учун қўлларим билан юрак ясадим"><figcaption>Юрагим — сизники ♡</figcaption></figure>
      <h2 id="letter-title">Мана, юрагим ҳам, меҳрим ҳам сиз учун. ❤️</h2>
      <p class="message">Масофалар бизни ажратса ҳам, қалбим доим сиз билан, олтиним.</p>
      <button id="music-toggle" class="music-toggle" aria-pressed="false"><span aria-hidden="true">♫</span> <span class="music-label">Мусиқани ёқиш</span></button>
      <p class="music-caption">Сиз учун яратилган майин куй</p>
      <button class="return-button" data-close>Конвертларга қайтиш <span aria-hidden="true">↩</span></button>
    </article>
  </template>
</body>
</html>
